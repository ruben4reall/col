name: ci
on:
  push:
    paths-ignore:
      - 'windows/**'
      - 'linux/**'
      - 'packaging/linux/**'
      - '.github/workflows/windows.yml'
      - '.github/workflows/linux.yml'
  pull_request:
    paths-ignore:
      - 'windows/**'
      - 'linux/**'
      - 'packaging/linux/**'
      - '.github/workflows/windows.yml'
      - '.github/workflows/linux.yml'
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test ColKit
        run: swift test --package-path Packages/ColKit
      - name: Test TiroirKit (the menu bar's drawers)
        run: swift test --package-path Packages/TiroirKit
  app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Col.app (ad hoc signature)
        run: scripts/build.sh Debug
