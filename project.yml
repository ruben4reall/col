name: Islet
options:
  bundleIdPrefix: ch.rubencatalao
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.5"
packages:
  IsletKit:
    path: Packages/IsletKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Islet:
    type: application
    platform: macOS
    sources:
      - App
      - path: MediaBridge/media-bridge.pl
        buildPhase: resources
    dependencies:
      - package: IsletKit
        product: IsletShell
      - package: IsletKit
        product: IsletPrompter
      - package: Sparkle
      # The `islet` command, in Contents/Helpers: next to the app's executable it would collide with "Islet",
      # since the disk ignores case.
      - target: IsletCommand
        link: false
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # Loaded by /usr/bin/perl at run time, never linked. It ships in Contents/Frameworks, where signing and
      # notarization expect code to live.
      - target: IsletMediaBridge
        link: false
        embed: true
        codeSign: true
        copy:
          destination: frameworks
    # The hardened runtime blocks the camera, the microphone and calendars unless the app declares them: the mirror,
    # the prompter's voice modes, the agenda and reminders.
    entitlements:
      path: App/Islet.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.calendars: true
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Islet
        CFBundleDisplayName: Islet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, fr]
        LSMinimumSystemVersion: "14.0"
        # Lives in the notch: no Dock icon, no main menu.
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Ruben Catalao. MIT License. Islet is not affiliated with Apple."
        # Updates: Sparkle 2, EdDSA-signed disk images, feed on the website. The welcome tour asks about automatic checks
        # (on by default), so Sparkle never shows its own permission alert.
        SUFeedURL: https://getislet.vercel.app/appcast.xml
        SUPublicEDKey: "EVBzQWvhJdJFEE6Pya8zNtRKPa/V4o8rIMnbwdLDXiU="
        SUVerifyUpdateBeforeExtraction: true
        SUEnableAutomaticChecks: true
        NSCalendarsFullAccessUsageDescription: Islet shows your next events in the notch.
        NSCameraUsageDescription: Islet uses the camera only when you open its mirror.
        NSBluetoothAlwaysUsageDescription: Islet reads the battery of your AirPods and other headphones.
        NSRemindersFullAccessUsageDescription: Islet shows the reminders due today beside your agenda.
        NSMicrophoneUsageDescription: The prompter listens to your voice to roll the script as you speak. The sound never leaves your Mac and is never recorded.
        NSSpeechRecognitionUsageDescription: In Voice Follow, the prompter recognizes your words on your Mac to keep your place in the script.
        NSLocalNetworkUsageDescription: The prompter's remote lets your phone, on the same network, play, pause and move the script.
        CFBundleURLTypes:
          - CFBundleURLName: ch.rubencatalao.islet
            CFBundleURLSchemes: [islet]
          # The links of Souffleur, the prompter's former app, so shortcuts made for it keep working.
          - CFBundleURLName: ch.rubencatalao.islet.souffleur
            CFBundleURLSchemes: [souffleur]
        # Documents the prompter can read a script from: opened with Islet, they join its library.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Script
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - net.daringfireball.markdown
              - public.rtf
              - org.openxmlformats.wordprocessingml.document
              - org.openxmlformats.presentationml.presentation
              - com.adobe.pdf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.rubencatalao.islet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  IsletMediaBridge:
    type: library.dynamic
    platform: macOS
    sources:
      - path: MediaBridge/IsletMediaBridge.m
    settings:
      base:
        PRODUCT_NAME: IsletMediaBridge
        EXECUTABLE_PREFIX: lib
        CLANG_ENABLE_OBJC_ARC: YES
        OTHER_LDFLAGS: -framework Foundation
        SKIP_INSTALL: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
  # Named apart from the app: the disk ignores case, so "islet" and "Islet" would collide.
  IsletCommand:
    type: tool
    platform: macOS
    sources:
      - path: CLI
    settings:
      base:
        PRODUCT_NAME: islet
        PRODUCT_MODULE_NAME: IsletCommand
        SKIP_INSTALL: YES
