name: Col
options:
  bundleIdPrefix: ch.rubencatalao
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.5"
packages:
  ColKit:
    path: Packages/ColKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Col:
    type: application
    platform: macOS
    sources:
      - App
      - path: MediaBridge/media-bridge.pl
        buildPhase: resources
    dependencies:
      - package: ColKit
        product: ColShell
      - package: ColKit
        product: ColPrompter
      - package: Sparkle
      # The `colctl` command, in Contents/Helpers, with `islet` beside it (below). Hooks installed under Islet call
      # ~/.local/bin/islet, which Col links to colctl on its first launch.
      - target: ColCommand
        link: false
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # Loaded by /usr/bin/perl at run time, never linked. It ships in Contents/Frameworks, where signing and
      # notarization expect code to live.
      - target: ColMediaBridge
        link: false
        embed: true
        codeSign: true
        copy:
          destination: frameworks
    postBuildScripts:
      # Islet's command was Contents/Helpers/islet: its hooks reach it through ~/.local/bin/islet, and Homebrew's
      # Islet cask links <prefix>/bin/islet to it. Sparkle installs 2.0 in place, before any of Col's code runs, and
      # Homebrew keeps the copy it installed as Islet.app: this relative link keeps those commands working. Made
      # after the command is embedded and before the app is signed.
      - name: Link the islet command
        script: ln -sfh colctl "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/islet"
        basedOnDependencyAnalysis: false
    # The hardened runtime blocks the camera, the microphone and calendars unless the app declares them: the mirror,
    # the prompter's voice modes, the agenda and reminders.
    entitlements:
      path: App/Col.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.calendars: true
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Col
        CFBundleDisplayName: Col
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, fr]
        LSMinimumSystemVersion: "14.0"
        # Lives in the notch: no Dock icon, no main menu.
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Ruben Catalao. MIT License. Col is not affiliated with Apple."
        # Updates: Sparkle 2, EdDSA-signed disk images, feed on the website. The welcome tour asks about automatic checks
        # (on by default), so Sparkle never shows its own permission alert.
        SUFeedURL: https://getcol.vercel.app/appcast.xml
        SUPublicEDKey: "EVBzQWvhJdJFEE6Pya8zNtRKPa/V4o8rIMnbwdLDXiU="
        SUVerifyUpdateBeforeExtraction: true
        SUEnableAutomaticChecks: true
        NSCalendarsFullAccessUsageDescription: Col shows your next events in the notch.
        NSCameraUsageDescription: Col uses the camera only when you open its mirror.
        NSBluetoothAlwaysUsageDescription: Col reads the battery of your AirPods and other headphones.
        NSRemindersFullAccessUsageDescription: Col shows the reminders due today beside your agenda.
        NSMicrophoneUsageDescription: The prompter listens to your voice to roll the script as you speak. The sound never leaves your Mac and is never recorded.
        NSSpeechRecognitionUsageDescription: In Voice Follow, the prompter recognizes your words on your Mac to keep your place in the script.
        NSLocalNetworkUsageDescription: "Col reaches the devices you choose on your network, and only them: your phone for the prompter's remote, and the AI servers you add."
        # The AI servers are the user's own, often plain http on their network under a name such as mac-studio.lan,
        # which App Transport Security would refuse. Everything else Col reaches (the update feed, LRCLIB) is https.
        # Nothing else may sit beside this key: NSAllowsLocalNetworking, for one, would turn it off.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: ch.rubencatalao.islet
            CFBundleURLSchemes: [col, islet]
          # The links of Souffleur, the prompter's former app, so shortcuts made for it keep working.
          - CFBundleURLName: ch.rubencatalao.islet.souffleur
            CFBundleURLSchemes: [souffleur]
        # Documents the prompter can read a script from: opened with Col, they join its library.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Script
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - net.daringfireball.markdown
              - public.rtf
              - org.openxmlformats.wordprocessingml.document
              - org.openxmlformats.presentationml.presentation
              - com.adobe.pdf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.rubencatalao.islet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ColMediaBridge:
    type: library.dynamic
    platform: macOS
    sources:
      - path: MediaBridge/ColMediaBridge.m
    settings:
      base:
        PRODUCT_NAME: ColMediaBridge
        EXECUTABLE_PREFIX: lib
        CLANG_ENABLE_OBJC_ARC: YES
        OTHER_LDFLAGS: -framework Foundation
        SKIP_INSTALL: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
  # The command line tool. Not `col`: macOS has its own `col` command in /usr/bin.
  ColCommand:
    type: tool
    platform: macOS
    sources:
      - path: CLI
    settings:
      base:
        PRODUCT_NAME: colctl
        PRODUCT_MODULE_NAME: ColCommand
        SKIP_INSTALL: YES
